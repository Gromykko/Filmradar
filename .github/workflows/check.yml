name: Check TV schedules

on:
  schedule:
    # Twice an hour, deliberately NOT on :00/:30. GitHub queues scheduled runs
    # best-effort and the top and half of the hour are when everybody else's
    # crons pile in, so those slots get delayed the worst — observed gaps of
    # 1-4 hours against a '*/30' schedule. An odd offset gets picked up sooner.
    # Still best-effort: treat it as "about twice an hour", never a guarantee.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse and report, but send no notifications'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'data/watchlist.json'
      - 'data/sources.json'
      - 'scraper/**'

concurrency:
  group: schedule-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        # If the parser is broken, a "no films found" result is meaningless.
        # Fail loudly here rather than silently reporting nothing for weeks.
        run: node scraper/test/all.mjs

      - name: Check schedules
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scraper/check.mjs --dry-run --debug
          else
            node scraper/check.mjs
          fi

      - name: Commit updated data
        # Runs even when the check step failed. Failure is now a deliberate
        # signal (a broken Moldova 1/2 parser, or notifications not being
        # delivered) — but the run still produced data worth keeping, and the
        # per-run commit is also what stops GitHub disabling this cron after
        # 60 days of repo inactivity. Without always(), the very outage the
        # red run is warning about would also silence the schedule entirely.
        if: always()
        run: |
          # Commit as the repo owner, not as the Actions bot. The bot address
          # is what GitHub was counting as a second contributor on a one-person
          # repository. This is GitHub's own noreply alias for the account — it
          # attributes the commit correctly without publishing a private address
          # in every snapshot. The commits stay obviously automated: they all
          # say "data: schedule snapshot".
          git config user.name  "Gromykko"
          git config user.email "186803449+Gromykko@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: schedule snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            # The cron and a manual run can race; rebase rather than fail.
            for i in 1 2 3; do
              git pull --rebase --autostash origin ${{ github.ref_name }} && \
              git push && exit 0
              sleep 5
            done
            echo "Push failed after 3 attempts" >&2
            exit 1
          fi
