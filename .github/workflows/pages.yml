name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  # The scheduled check commits data/ using the default GITHUB_TOKEN, and
  # GitHub deliberately does NOT fire workflows from such pushes (it is how
  # they stop a workflow re-triggering itself forever). So the push trigger
  # above never sees the half-hourly data commits, and the dashboard would
  # sit frozen on the last human push while the repo data moved on without
  # it. Redeploying after every check run is what keeps the site live.
  workflow_run:
    workflows: ['Check TV schedules']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        # The dashboard fetches ../data/*.json, so data/ ships alongside docs/.
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          mkdir -p _site/data
          cp data/*.json _site/data/ 2>/dev/null || true
          # Pages would otherwise run Jekyll and swallow files beginning with _
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
