name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        # The dashboard fetches ../data/*.json, so data/ ships alongside docs/.
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          mkdir -p _site/data
          cp data/*.json _site/data/ 2>/dev/null || true
          # Pages would otherwise run Jekyll and swallow files beginning with _
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
