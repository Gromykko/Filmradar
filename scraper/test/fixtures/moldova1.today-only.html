<!doctype html>

<head><title>TRM - Moldova 1</title></head>
<body>
<!--
  This fixture mirrors what trm.md ACTUALLY returns to a plain HTTP fetch:
  all seven weekday tab labels, then ONLY the current day's slots. The other
  six tabs are populated client-side by JavaScript we never execute.

  A naive parser reads the last tab label ("duminică") as a heading and files
  every slot under Sunday. This fixture exists to make sure that never happens
  again — the slots below must come out day-less and then be attributed to
  today via todayInChisinau(), flagged dayAssumed.
-->
<div id="program">
<h3>PROGRAM</h3>

  <li><a href="#">miercuri</a></li>
  <li><a href="#">joi</a></li>
  <li><a href="#">vineri</a></li>
  <li><a href="#">s&#238;mb&#259;t&#259;</a></li>
  <li><a href="#">duminic&#259;</a></li>
</ul>
